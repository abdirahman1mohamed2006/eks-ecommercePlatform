name: EKS-Terraform Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - terraform/**

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VAR_api_allowed_cidrs: '["${{ vars.API_ALLOWED_IP }}/32"]'

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy IaC scan (Terraform)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Show OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+')

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub, aud}' || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform plan
        uses: dflook/terraform-plan@v2
        with:
          path: terraform

      - name: Terraform apply
        uses: dflook/terraform-apply@v2
        with:
          path: terraform
          auto_approve: true