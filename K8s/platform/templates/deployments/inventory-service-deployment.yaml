apiVersion: apps/v1
kind: Deployment
metadata:
	name: inventory-service
	labels:
		app.kubernetes.io/name: inventory-service
spec:
	replicas: {{ .Values.replicaCount }}
	revisionHistoryLimit: 5
	progressDeadlineSeconds: 600
	minReadySeconds: 10
	strategy:
		type: RollingUpdate
		rollingUpdate:
			maxSurge: 1
			maxUnavailable: 0
	selector:
		matchLabels:
			app.kubernetes.io/name: inventory-service
	template:
		metadata:
			labels:
				app.kubernetes.io/name: inventory-service
		spec:
			serviceAccountName: {{ printf "%s-%s" .Release.Name "inventory-service" | trunc 63 | trimSuffix "-" }}
			containers:
				- name: inventory-service
					image: {{ index .Values.images "inventory-service" "image" | quote }}
					imagePullPolicy: {{ index .Values.images "inventory-service" "pullPolicy" }}
					ports:
						- name: http
							containerPort: 8082
							protocol: TCP
					env:
						- name: DATABASE_URL
							valueFrom:
								secretKeyRef:
									name: {{ .Values.database.urlSecretName }}
									key: {{ .Values.database.urlSecretKey }}
					startupProbe:
						httpGet:
							path: /healthz
							port: http
						periodSeconds: 10
						failureThreshold: 30
					readinessProbe:
						httpGet:
							path: /healthz
							port: http
						periodSeconds: 10
					livenessProbe:
						httpGet:
							path: /livez
							port: http
						periodSeconds: 20
