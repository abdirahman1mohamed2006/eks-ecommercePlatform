apiVersion: apps/v1
kind: Deployment
metadata:
	name: scheduler
	labels:
		app.kubernetes.io/name: scheduler
spec:
	replicas: 1
	selector:
		matchLabels:
			app.kubernetes.io/name: scheduler
	template:
		metadata:
			labels:
				app.kubernetes.io/name: scheduler
		spec:
			serviceAccountName: {{ printf "%s-%s" .Release.Name "scheduler" | trunc 63 | trimSuffix "-" }}
			containers:
				- name: scheduler
					image: {{ index .Values.images "scheduler" "image" | quote }}
					imagePullPolicy: {{ index .Values.images "scheduler" "pullPolicy" }}
					ports:
						- name: health
							containerPort: 8091
							protocol: TCP
					env:
						- name: DATABASE_URL
							valueFrom:
								secretKeyRef:
									name: {{ .Values.database.urlSecretName }}
									key: {{ .Values.database.urlSecretKey }}
					startupProbe:
						httpGet:
							path: /healthz
							port: health
						periodSeconds: 10
						failureThreshold: 30
					readinessProbe:
						httpGet:
							path: /healthz
							port: health
						periodSeconds: 10
					livenessProbe:
						httpGet:
							path: /livez
							port: health
						periodSeconds: 20
