apiVersion: apps/v1
kind: Deployment
metadata:
	name: dashboard-api
	labels:
		app.kubernetes.io/name: dashboard-api
spec:
	replicas: {{ .Values.replicaCount }}
	selector:
		matchLabels:
			app.kubernetes.io/name: dashboard-api
	template:
		metadata:
			labels:
				app.kubernetes.io/name: dashboard-api
		spec:
			serviceAccountName: {{ printf "%s-%s" .Release.Name "dashboard-api" | trunc 63 | trimSuffix "-" }}
			containers:
				- name: dashboard-api
					image: {{ index .Values.images "dashboard-api" "image" | quote }}
					imagePullPolicy: {{ index .Values.images "dashboard-api" "pullPolicy" }}
					ports:
						- name: http
							containerPort: 8086
							protocol: TCP
					env:
						- name: DATABASE_URL
							valueFrom:
								secretKeyRef:
									name: {{ .Values.database.urlSecretName }}
									key: {{ .Values.database.urlSecretKey }}
					startupProbe:
						httpGet:
							path: /healthz
							port: http
						periodSeconds: 10
						failureThreshold: 30
					readinessProbe:
						httpGet:
							path: /healthz
							port: http
						periodSeconds: 10
					livenessProbe:
						httpGet:
							path: /livez
							port: http
						periodSeconds: 20
