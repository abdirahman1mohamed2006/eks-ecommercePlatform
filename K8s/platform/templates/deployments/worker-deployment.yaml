apiVersion: apps/v1
kind: Deployment
metadata:
	name: worker
	labels:
		app.kubernetes.io/name: worker
spec:
	replicas: 1
	selector:
		matchLabels:
			app.kubernetes.io/name: worker
	template:
		metadata:
			labels:
				app.kubernetes.io/name: worker
		spec:
			serviceAccountName: {{ printf "%s-%s" .Release.Name "worker" | trunc 63 | trimSuffix "-" }}
			containers:
				- name: worker
					image: {{ index .Values.images "worker" "image" | quote }}
					imagePullPolicy: {{ index .Values.images "worker" "pullPolicy" }}
					ports:
						- name: health
							containerPort: 8090
							protocol: TCP
					env:
						- name: SQS_QUEUE_URL
							value: {{ .Values.sqs.queueUrl | quote }}
						- name: AWS_REGION
							value: {{ .Values.aws.region | quote }}
						- name: ORDER_SERVICE_URL
							value: http://order-service:8081
						- name: INVENTORY_SERVICE_URL
							value: http://inventory-service:8082
						- name: PAYMENT_SERVICE_URL
							value: http://payment-service:8083
						- name: NOTIFICATION_SERVICE_URL
							value: http://notification-service:8084
						- name: SHIPPING_SERVICE_URL
							value: http://shipping-service:8085
					startupProbe:
						httpGet:
							path: /healthz
							port: health
						periodSeconds: 10
						failureThreshold: 30
					readinessProbe:
						httpGet:
							path: /healthz
							port: health
						periodSeconds: 10
					livenessProbe:
						httpGet:
							path: /livez
							port: health
						periodSeconds: 20
