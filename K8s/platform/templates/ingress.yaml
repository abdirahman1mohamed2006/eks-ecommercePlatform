apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api-gateway

spec:
  ingressClassName: traefik

  rules:
    - host: abdirahman.forum
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

                  