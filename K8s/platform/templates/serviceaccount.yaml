{{- $root := . }}
{{- range $service := list "api-gateway" "dashboard-api" "inventory-service" "notification-service" "order-service" "payment-service" "scheduler" "shipping-service" "worker" }}
{{- $sqsConfig := index $root.Values.serviceAccounts $service | default dict }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $root.Release.Name $service | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ $service | quote }}
  {{- with $sqsConfig.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
